<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Writing & Drawing Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Griffy&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <link rel="icon" type="image/png" href="/assets/SmartBoardOne.png" />
  <style>
    :root {
      --bg: #044CBA;
      --panel: #083d8d;
      --accent: #F8F3F0;
      --accent-hover: #c4c2c1;
      --text: #e2e8f0;
      --muted: #0a0a0b;
      --danger: #dd1b1b;
      --border: #060606;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Rubik', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--panel);
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .hero-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .hero-head {
      font-family: "Black Ops One", system-ui;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--accent);
      margin: 0;
      
    }

    .hero-by {
      font-family: "Griffy", system-ui;
      font-size: 1rem;
      font-weight: 400;
      color: var(--accent);
    }

    .key-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .key-box input {
      padding: 0.4rem 0.7rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      width: 220px;
      font-size: 0.85rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    button:hover:not(:disabled) {
      background: #334155;
      border-color: var(--accent);
    }

    button.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }

    button:disabled { opacity: 0.5; cursor: not-allowed; }

    button.primary {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }

    button.primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button.danger {
      border-color: var(--danger);
      color: var(--danger);
    }

    button.danger:hover:not(:disabled) {
      background: rgba(248, 113, 113, 0.15);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 1rem;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    .canvas-wrapper {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      position: relative;
      flex: 1;
      min-height: 420px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #c { display: block; max-width: 100%; touch-action: none; }

    .status {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.75);
      color: #fff;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      pointer-events: none;
    }

    .output-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      min-height: 120px;
      max-height: 240px;
      overflow-y: auto;
    }

    .output-panel h2 {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    #ai-output {
      white-space: pre-wrap;
      line-height: 1.55;
      font-size: 0.95rem;
    }

    #ai-output:empty::before {
      content: 'AI responses will appear here after you use Clean Writing, Perfect Shape, or Solve Question.';
      color: var(--muted);
      font-style: italic;
    }

    .loading {
      display: none;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent);
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }

    .loading.visible { display: flex; }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      text-align: center;
      padding: 0.6rem;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    @media (max-width: 768px) {
      header { flex-direction: column; align-items: flex-start; }
      .toolbar { width: 100%; }
      button { flex: 1 1 auto; justify-content: center; }
      .key-box input { width: 160px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="hero-container">
      <img src="assets/SmartBoardOne.png" alt="Smart Board One" style="height: 50px; margin-right: 1rem;" />
      <h2 class="hero-head">Smart Board One</h2>
    </div>
    <a href="https://adevz.xo.je/" target="_blank"><h3 class="hero-by">By: AqshaiDev</h3></a>

    <div class="key-box">
      <input id="api-key-input" type="password" placeholder="Paste Gemini API Key" />
      <button id="btn-save-key">Save Key</button>
    </div>

    <div class="toolbar">
      <button id="btn-brush" class="active">Pen</button>
      <button id="btn-select">Select</button>
      <button id="btn-clean" class="primary">Clean HandWriting</button>
      <button id="btn-shape" class="primary">Snap 2 Shape</button>
      <button id="btn-solve" class="primary">Solve/Answer Question</button>
      <button id="btn-clear" class="danger">Clear</button>
    </div>
  </header>

  <div class="main">
    <div class="canvas-wrapper">
      <canvas id="c"></canvas>
      <div class="status" id="mode-status">Mode: Brush</div>
    </div>

    <div class="output-panel">
      <h2>AI Response</h2>
      <div id="ai-output"></div>
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <span>Thinking with Gemini 2.5 Flash…</span>
      </div>
    </div>
  </div>

  <footer>
    Use Gemini 2.5 Flash API key · AqshaiDev · SmartBoardOne · Works on Localhost aswell
  </footer>

  <script>
    // ---------- API Key ----------
    const apiKeyInput = document.getElementById('api-key-input');
    const btnSaveKey  = document.getElementById('btn-save-key');

    const savedKey = localStorage.getItem('gemini_api_key');
    if (savedKey) apiKeyInput.value = savedKey;

    btnSaveKey.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      if (key) {
        localStorage.setItem('gemini_api_key', key);
        alert('API key saved!');
      } else {
        localStorage.removeItem('gemini_api_key');
        alert('API key cleared.');
      }
    });

    // ---------- Canvas ----------
    const wrapper = document.querySelector('.canvas-wrapper');

    function resizeCanvas() {
      const maxW = Math.min(wrapper.clientWidth - 4, 1100);
      const h = Math.max(420, Math.min(window.innerHeight * 0.55, 620));
      canvas.setWidth(maxW);
      canvas.setHeight(h);
      canvas.renderAll();
    }

    const canvas = new fabric.Canvas('c', {
      isDrawingMode: true,
      backgroundColor: '#ffffff',
      selection: false
    });

    canvas.freeDrawingBrush.width = 3;
    canvas.freeDrawingBrush.color = '#1e293b';

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ---------- Mode ----------
    const btnBrush = document.getElementById('btn-brush');
    const btnSelect = document.getElementById('btn-select');
    const modeStatus = document.getElementById('mode-status');

    function setMode(mode) {
      if (mode === 'brush') {
        canvas.isDrawingMode = true;
        canvas.selection = false;
        canvas.discardActiveObject();
        canvas.renderAll();
        btnBrush.classList.add('active');
        btnSelect.classList.remove('active');
        modeStatus.textContent = 'Mode: Brush';
      } else {
        canvas.isDrawingMode = false;
        canvas.selection = true;
        btnSelect.classList.add('active');
        btnBrush.classList.remove('active');
        modeStatus.textContent = 'Mode: Select';
      }
    }

    btnBrush.addEventListener('click', () => setMode('brush'));
    btnSelect.addEventListener('click', () => setMode('select'));

    // ---------- Clear ----------
    document.getElementById('btn-clear').addEventListener('click', () => {
      if (confirm('Clear the entire board?')) {
        canvas.clear();
        canvas.backgroundColor = '#ffffff';
        canvas.renderAll();
        document.getElementById('ai-output').textContent = '';
      }
    });

    // ---------- Helpers ----------
    function removeFreehandPaths() {
      canvas.getObjects().filter(o => o.type === 'path').forEach(o => canvas.remove(o));
    }

    function removeAIObjects() {
      canvas.getObjects().filter(o => o.aiGenerated === true).forEach(o => canvas.remove(o));
    }

    function drawPerfectShapes(shapes) {
      if (!Array.isArray(shapes)) return;

      shapes.forEach(s => {
        let obj = null;
        const common = {
          stroke: s.stroke || '#1e293b',
          strokeWidth: s.strokeWidth || 3,
          fill: s.fill || 'transparent',
          selectable: true,
          aiGenerated: true
        };

        switch (s.type) {
          case 'circle':
            obj = new fabric.Circle({
              left: s.left || 50, top: s.top || 50,
              radius: s.radius || 40, ...common
            });
            break;
          case 'ellipse':
            obj = new fabric.Ellipse({
              left: s.left || 50, top: s.top || 50,
              rx: (s.width || 80) / 2, ry: (s.height || 50) / 2, ...common
            });
            break;
          case 'rect':
            obj = new fabric.Rect({
              left: s.left || 50, top: s.top || 50,
              width: s.width || 100, height: s.height || 60, ...common
            });
            break;
          case 'triangle':
            obj = new fabric.Triangle({
              left: s.left || 50, top: s.top || 50,
              width: s.width || 100, height: s.height || 80, ...common
            });
            break;
          case 'line':
            obj = new fabric.Line(
              [s.x1 || 50, s.y1 || 50, s.x2 || 150, s.y2 || 50],
              { ...common }
            );
            break;
        }
        if (obj) canvas.add(obj);
      });
    }

    function placeCleanedText(data) {
      removeFreehandPaths();
      removeAIObjects();

      const text = data?.cleanedText || '';
      if (!text) return;

      const left = data?.left ?? 20;
      const top  = data?.top ?? 20;
      const w    = Math.max(data?.width || 200, 200);

      const textObj = new fabric.Textbox(text, {
        left, top,
        width: Math.min(w, canvas.width - left - 20),
        fontSize: 18,
        fill: '#0f172a',
        fontFamily: 'Segoe UI, system-ui, sans-serif',
        backgroundColor: 'rgba(255,255,255,0.92)',
        padding: 10,
        aiGenerated: true
      });
      canvas.add(textObj);
      canvas.setActiveObject(textObj);
    }

    function placeSolution(data) {
      const answer = data?.finalAnswer || data?.solution || '';
      if (!answer) return;

      let maxBottom = 40;
      canvas.getObjects().forEach(o => {
        const bottom = (o.top || 0) + (o.getScaledHeight ? o.getScaledHeight() : (o.height || 0));
        if (bottom > maxBottom) maxBottom = bottom;
      });

      const left = data?.left ?? 20;
      let top = data?.top ?? maxBottom + 30;
      if (top < maxBottom + 10) top = maxBottom + 30;
      if (top > canvas.height - 80) top = Math.max(20, canvas.height - 120);

      const textObj = new fabric.Textbox(answer, {
        left, top,
        width: Math.min(420, canvas.width - left - 30),
        fontSize: 22,
        fontWeight: 'bold',
        fill: '#0f172a',
        fontFamily: 'Segoe UI, system-ui, sans-serif',
        backgroundColor: 'rgba(187, 247, 208, 0.95)',
        padding: 14,
        textAlign: 'center',
        aiGenerated: true
      });
      canvas.add(textObj);
      canvas.setActiveObject(textObj);
    }

    // ---------- AI actions ----------
    const loadingEl = document.getElementById('loading');
    const outputEl = document.getElementById('ai-output');
    const actionButtons = [
      document.getElementById('btn-clean'),
      document.getElementById('btn-shape'),
      document.getElementById('btn-solve')
    ];

    async function processCanvas(action) {
      const key = localStorage.getItem('gemini_api_key');
      if (!key) {
        alert('Please enter and save your Gemini API key first.');
        return;
      }

      actionButtons.forEach(b => b.disabled = true);
      loadingEl.classList.add('visible');
      outputEl.textContent = '';

      try {
        const dataURL = canvas.toDataURL({
          format: 'png',
          quality: 0.9,
          multiplier: 1.2
        });

        const res = await fetch('/api/process-canvas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            image: dataURL,
            action,
            width: canvas.width,
            height: canvas.height,
            apiKey: key
          })
        });

        const payload = await res.json();

        if (!res.ok) {
          throw new Error(payload.error || payload.details || 'Request failed');
        }

        const structured = payload.data;

        if (action === 'clean-text') {
          placeCleanedText(structured);
          outputEl.textContent = structured?.cleanedText || payload.result || 'No text found.';
        }
        else if (action === 'detect-shape') {
          removeFreehandPaths();
          if (structured?.shapes) {
            drawPerfectShapes(structured.shapes);
            outputEl.textContent = structured.summary || `Detected ${structured.shapes.length} shape(s).`;
          } else {
            outputEl.textContent = payload.result || 'Could not detect shapes.';
          }
        }
        else if (action === 'solve') {
          placeSolution(structured);
          if (structured) {
            outputEl.textContent = (structured.solution || '') +
              (structured.finalAnswer ? '\n\nFinal Answer: ' + structured.finalAnswer : '');
          } else {
            outputEl.textContent = payload.result || 'No solution generated.';
          }
        }

        setMode('select');
        canvas.renderAll();

      } catch (err) {
        console.error(err);
        outputEl.textContent = 'Error: ' + (err.message || 'Something went wrong.');
      } finally {
        loadingEl.classList.remove('visible');
        actionButtons.forEach(b => b.disabled = false);
      }
    }

    document.getElementById('btn-clean').addEventListener('click', () => processCanvas('clean-text'));
    document.getElementById('btn-shape').addEventListener('click', () => processCanvas('detect-shape'));
    document.getElementById('btn-solve').addEventListener('click', () => processCanvas('solve'));
  </script>
</body>
</html>
